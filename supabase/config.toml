# Supabase lokale configuratie.
# Koppel aan een cloud-project met: supabase link --project-ref <ref>
project_id = "thenewwaveit"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://thenewwaveit.com"]
jwt_expiry = 3600
enable_signup = true

[storage]
enabled = true
